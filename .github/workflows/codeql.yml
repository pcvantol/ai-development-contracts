name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '21 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@e2b3eafc6841a1765a8baf0216775a3cb5c0a7aa # v3.28.17
        with:
          languages: python
      - uses: github/codeql-action/analyze@e2b3eafc6841a1765a8baf0216775a3cb5c0a7aa # v3.28.17
