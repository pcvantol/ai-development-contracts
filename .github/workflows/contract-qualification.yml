name: Contract qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate contracts, profiles, projections and drift canaries
        run: python3 scripts/validate.py
      - name: Validate governance registry and read-only auditor
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/governance_audit.py check --registry governance/estate.json --root .. --repository ai-development-contracts
      - name: Ensure generated self projection is committed and current
        run: python3 tools/materialize.py check --repository ai-development-contracts
      - name: Install the standalone TDE runtime
        run: python3 -m pip install --disable-pip-version-check technical-debt-engine-runtime==1.1.1
      - name: Produce central TDE evidence
        run: tde assess --capability complexity .
