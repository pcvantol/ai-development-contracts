name: Contract qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate contracts, profiles, projections and drift canaries
        run: python3 scripts/validate.py
      - name: Ensure generated self projection is committed and current
        run: python3 tools/materialize.py check --repository ai-development-contracts
      - name: Install the standalone TDE runtime
        run: python3 -m pip install --disable-pip-version-check technical-debt-engine-runtime==1.1.1
      - name: Produce central TDE evidence
        run: tde assess --capability complexity .
